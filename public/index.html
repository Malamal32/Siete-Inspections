document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"efc55ab3-cfe9-4139-b1ba-de9aefde9029\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>\nbody{margin:0;background:#f4f7fb;font-family:\"Segoe UI\",system-ui,-apple-system,sans-serif;color:#1f2328;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n*{box-sizing:border-box}\na{color:#005b96}a:hover{color:#003d67}\nbutton,input,select,textarea{font:inherit}\nbutton:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid #005b96;outline-offset:2px}\n@media print{body{background:#fff}[data-noprint]{display:none !important}[data-report]{box-shadow:none !important;margin:0 !important;max-width:none !important;padding:0 !important}[data-avoid]{break-inside:avoid}@page{size:letter;margin:0.5in}}\n<\u002Fstyle>\n<script src=\"a9904685-deb8-4444-b27f-979815010e03\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;flex-direction:column\">\n<header data-noprint=\"\" style=\"background:#003d67;color:#fff\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <img src=\"f17af92e-dbdc-4083-954c-268fb1464353\" alt=\"Siete\" style=\"width:44px;height:44px;border-radius:50%;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.85)\">\n      <span style=\"font-weight:800;letter-spacing:.04em;font-size:20px\">PEPSICO<\u002Fspan>\n      <span style=\"font-weight:600;font-size:19px\">Siete Safety Inspections<\u002Fspan>\n    <\u002Fdiv>\n    <nav style=\"display:flex;gap:6px;flex:1 1 auto\">\n      <button sc-camel-on-click=\"{{ goList }}\" style=\"background:{{ navListBg }};color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px\">Inspections<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goTemplates }}\" style=\"background:{{ navTplBg }};color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px\">Checklists<\u002Fbutton>\n    <\u002Fnav>\n    <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:#d6e6f3;white-space:nowrap\">Signed in as\n      <sc-raw-select value=\"{{ userIdx }}\" sc-camel-on-change=\"{{ onUser }}\" style=\"background:#fff;color:#1f2328;border:0;border-radius:6px;padding:8px 10px;min-height:40px\">\n        <sc-for list=\"{{ users }}\" as=\"u\" hint-placeholder-count=\"2\"><option value=\"{{ u.value }}\">{{ u.label }}<\u002Foption><\u002Fsc-for>\n      <\u002Fsc-raw-select>\n    <\u002Flabel>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<sc-if value=\"{{ isList }}\" hint-placeholder-val=\"{{ true }}\">\n<main style=\"width:100%;max-width:1200px;margin:0 auto;padding:28px 20px 64px;display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px\">\n    <div>\n      <h1 style=\"margin:0;font-size:28px;color:#003d67\">Inspections<\u002Fh1>\n      <p style=\"margin:4px 0 0;color:#5c6670\">{{ listSummary }}<\u002Fp>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ openPicker }}\" style=\"background:#005b96;color:#fff;border:2px solid #005b96;border-radius:8px;padding:10px 20px;font-weight:600;font-size:15px;cursor:pointer;min-height:44px\" style-hover=\"background:#003d67;border-color:#003d67\">+ New Inspection<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n    <input value=\"{{ search }}\" sc-camel-on-change=\"{{ onSearch }}\" placeholder=\"Search by ID, facility, inspector or checklist\" style=\"flex:1 1 280px;min-height:44px;border:1px solid #c8d1da;border-radius:8px;padding:10px 14px;background:#fff\">\n    <div style=\"display:flex;border:1px solid #c8d1da;border-radius:8px;overflow:hidden;background:#fff;flex-wrap:wrap\">\n      <sc-for list=\"{{ statusTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ t.select }}\" style=\"padding:10px 14px;border:0;background:{{ t.bg }};color:{{ t.fg }};font-weight:600;cursor:pointer;min-height:44px;display:flex;gap:6px;align-items:center\">{{ t.label }}<span style=\"font-size:12px;opacity:.8\">{{ t.count }}<\u002Fspan><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ noRows }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px dashed #c8d1da;border-radius:10px;padding:40px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:10px\">\n      <div style=\"font-size:18px;font-weight:600;color:#003d67\">{{ emptyTitle }}<\u002Fdiv>\n      <div style=\"color:#5c6670\">{{ emptyBody }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px\">\n    <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n      <button sc-camel-on-click=\"{{ r.open }}\" style=\"text-align:left;background:#fff;border:1px solid #d5dde5;border-radius:10px;padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:#1f2328\" style-hover=\"border-color:#005b96;box-shadow:0 2px 10px rgba(0,61,103,.12)\">\n        <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%\">\n          <span style=\"font-weight:700;font-size:17px;color:#003d67\">{{ r.code }}<\u002Fspan>\n          <span style=\"font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:{{ r.statusBg }};color:{{ r.statusFg }}\">{{ r.status }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:15px\">{{ r.template }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:#5c6670\">{{ r.meta }}<\u00 adius:8px;padding:8px 12px;font-weight:400;font-size:15px\"><\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3b4550\">ID prefix<input value=\"{{ tPrefix }}\" sc-camel-on-change=\"{{ onTPrefix }}\" placeholder=\"FORK\" style=\"min-height:44px;border:1px solid #c8d1da;border-radius:8px;padding:8px 12px;font-weight:400;font-size:15px;text-transform:uppercase\"><\u002Flabel>\n  <\u002Fdiv>\n  <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3b4550\">Description<textarea value=\"{{ tDesc }}\" sc-camel-on-change=\"{{ onTDesc }}\" rows=\"2\" style=\"border:1px solid #c8d1da;border-radius:8px;padding:10px 12px;font-weight:400;font-size:15px;resize:vertical\"><\u002Ftextarea><\u002Flabel>\n\n  <section style=\"display:flex;flex-direction:column;gap:10px\">\n    <h2 style=\"margin:0;font-size:18px;color:#003d67\">Header fields<\u002Fh2>\n    <sc-for list=\"{{ tFields }}\" as=\"f\" hint-placeholder-count=\"3\">\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n        <input value=\"{{ f.label }}\" sc-camel-on-change=\"{{ f.onLabel }}\" placeholder=\"Field label\" style=\"flex:1 1 220px;min-height:44px;border:1px solid #c8d1da;border-radius:8px;padding:8px 12px\">\n        <sc-raw-select value=\"{{ f.type }}\" sc-camel-on-change=\"{{ f.onType }}\" style=\"min-height:44px;border:1px solid #c8d1da;border-radius:8px;padding:8px 10px;background:#fff\"><option value=\"text\">Text<\u002Foption><option value=\"date\">Date<\u002Foption><\u002Fsc-raw-select>\n        <button sc-camel-on-click=\"{{ f.remove }}\" style=\"background:transparent;border:0;color:#5c6670;cursor:pointer;min-height:44px;padding:0 10px\" style-hover=\"color:#b11818\">Remove<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <button sc-camel-on-click=\"{{ addField }}\" style=\"align-self:flex-start;background:#fff;color:#005b96;border:2px dashed #7aa7c9;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer;min-height:44px\">+ Add field<\u002Fbutton>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap\"><h2 style=\"margin:0;font-size:18px;color:#003d67\">Sections &amp; items<\u002Fh2><span style=\"font-size:13px;color:#5c6670\">{{ tItemTotal }}<\u002Fspan><\u002Fdiv>\n    <sc-for list=\"{{ tSections }}\" as=\"sec\" hint-placeholder-count=\"2\">\n      <div style=\"background:#fff;border:1px solid #d5dde5;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n          <strong style=\"color:#003d67;width:24px\">{{ sec.letter }}.<\u002Fstrong>\n          <input value=\"{{ sec.title }}\" sc-camel-on-change=\"{{ sec.onTitle }}\" placeholder=\"Section title\" style=\"flex:1 1 220px;min-height:44px;border:1px solid #c8d1da;border-radius:8px;padding:8px 12px;font-weight:600;font-size:15px\">\n          <button sc-camel-on-click=\"{{ sec.up }}\" title=\"Move up\" style=\"width:44px;height:44px;border:1px solid #c8d1da;border-radius:8px;background:#fff;cursor:pointer\">↑<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ sec.down }}\" title=\"Move down\" style=\"width:44px;height:44px;border:1px solid #c8d1da;border-radius:8px;background:#fff;cursor:pointer\">↓<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ sec.remove }}\" style=\"background:transparent;border:0;color:#5c6670;cursor:pointer;min-height:44px;padding:0 10px\" style-hover=\"color:#b11818\">Remove section<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-for list=\"{{ sec.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:8px;align-items:center;padding-left:32px\">\n            <span style=\"width:28px;color:#5c6670;font-size:13px\">{{ it.num }}<\u002Fspan>\n            <input value=\"{{ it.text }}\" sc-camel-on-change=\"{{ it.onText }}\" placeholder=\"Inspection item\" style=\"flex:1 1 auto;min-width:0;min-height:44px;border:1px solid #c8d1da;border-radius:8px;padding:8px 12px\">\n            <button sc-camel-on-click=\"{{ it.up }}\" title=\"Move up\" style=\"width:40px;height:44px;border:1px solid #c8d1da;border-radius:8px;background:#fff;cursor:pointer\">↑<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ it.down }}\" title=\"Move down\" style=\"width:40px;height:44px;border:1px solid #c8d1da;border-radius:8px;background:#fff;cursor:pointer\">↓<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ it.remove }}\" title=\"Remove item\" style=\"width:40px;height:44px;border:1px solid #c8d1da;border-radius:8px;background:#fff;color:#b11818;cursor:pointer\">✕<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <button sc-camel-on-click=\"{{ sec.addItem }}\" style=\"align-self:flex-start;margin-left:32px;background:#fff;color:#005b96;border:2px dashed #7aa7c9;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer;min-height:44px\">+ Add item<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <button sc-camel-on-click=\"{{ addSection }}\" style=\"align-self:flex-start;background:#fff;color:#005b96;border:2px dashed #7aa7c9;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;min-height:44px\">+ Add section<\u002Fbutton>\n  <\u002Fsection>\n  <p style=\"margin:0;color:#5c6670;font-size:13px\">Every checklist also includes Deficiencies &amp; Corrective Actions, Inspector Comments and Sign-Off. Answers are OK / Needs Repair / N/A.<\u002Fp>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pickerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-noprint=\"\" sc-camel-on-click=\"{{ closePicker }}\" style=\"position:fixed;inset:0;background:rgba(0,20,40,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"background:#fff;border-radius:12px;padding:24px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)\">\n      <h2 style=\"margin:0;font-size:20px;color:#003d67\">Start a new inspection<\u002Fh2>\n      <sc-for list=\"{{ tplList }}\" as=\"t\" hint-placeholder-count=\"1\">\n        <button sc-camel-on-click=\"{{ t.start }}\" style=\"text-align:left;background:#fff;border:1px solid #c8d1da;border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:44px\" style-hover=\"border-color:#005b96;background:#f5f9fc\"><strong style=\"color:#003d67\">{{ t.name }}<\u002Fstrong><span style=\"font-size:13px;color:#5c6670\">{{ t.meta }}<\u002Fspan><\u002Fbutton>\n      <\u002Fsc-for>\n      <button sc-camel-on-click=\"{{ closePicker }}\" style=\"align-self:flex-end;background:transparent;border:0;color:#005b96;font-weight:600;cursor:pointer;min-height:44px;padding:0 10px\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ confirmOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-noprint=\"\" style=\"position:fixed;inset:0;background:rgba(0,20,40,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60\">\n    <div style=\"background:#fff;border-radius:12px;padding:24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px\">\n      <div style=\"font-size:17px;font-weight:600\">{{ confirmMsg }}<\u002Fdiv>\n      <div style=\"display:flex;gap:10px;justify-content:flex-end\">\n        <button sc-camel-on-click=\"{{ confirmCancel }}\" style=\"background:#fff;color:#005b96;border:2px solid #005b96;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;min-height:44px\">Cancel<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ confirmOk }}\" style=\"background:{{ confirmBg }};color:#fff;border:2px solid {{ confirmBg }};border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;min-height:44px\">{{ confirmLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ lbOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-noprint=\"\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;z-index:70\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#fff;gap:10px\">\n      <span style=\"font-weight:600\">{{ lbCount }}<\u002Fspan>\n      <div style=\"display:flex;gap:8px\">\n        <button sc-camel-on-click=\"{{ lbDelete }}\" style=\"background:transparent;color:#ffb3b3;border:1px solid #ffb3b3;border-radius:8px;padding:6px 14px;cursor:pointer;min-height:44px\">Delete photo<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ lbClose }}\" style=\"background:#fff;color:#1f2328;border:0;border-radius:8px;padding:6px 16px;font-weight:600;cursor:pointer;min-height:44px\">Close<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 10px 20px;min-height:0\">\n      <button sc-camel-on-click=\"{{ lbPrev }}\" style=\"width:48px;height:64px;border:0;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;font-size:24px;cursor:pointer;flex:none\">‹<\u002Fbutton>\n      <div role=\"img\" aria-label=\"Photo\" style=\"flex:1;align-self:stretch;min-width:0;background-image:{{ lbBg }};background-size:contain;background-position:center;background-repeat:no-repeat\"><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ lbNext }}\" style=\"width:48px;height:64px;border:0;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;font-size:24px;cursor:pointer;flex:none\">›<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<input type=\"file\" accept=\"image/*\" capture=\"environment\" ref=\"{{ capRef }}\" sc-camel-on-change=\"{{ onCapFile }}\" style=\"position:fixed;left:-9999px;width:1px;height:1px;opacity:0\">\n<sc-if value=\"{{ camOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-noprint=\"\" style=\"position:fixed;inset:0;background:#000;display:flex;flex-direction:column;z-index:75\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#fff;gap:10px\">\n      <span style=\"font-weight:600\">Take photo<\u002Fspan>\n      <button sc-camel-on-click=\"{{ camClose }}\" style=\"background:#fff;color:#1f2328;border:0;border-radius:8px;padding:6px 16px;font-weight:600;cursor:pointer;min-height:44px\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-height:0;display:flex;align-items:center;justify-content:center\">\n      <video ref=\"{{ camVideoRef }}\" sc-camel-auto-play=\"{{ true }}\" sc-camel-plays-inline=\"{{ true }}\" muted=\"{{ true }}\" style=\"max-width:100%;max-height:100%;background:#111\"><\u002Fvideo>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:center;gap:16px;padding:16px 16px 28px\">\n      <button sc-camel-on-click=\"{{ camSnap }}\" aria-label=\"Capture\" style=\"width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#005b96;cursor:pointer\" style-hover=\"background:#003d67\"><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-noprint=\"\" style=\"position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:80;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.3)\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    ready: false, screen: 'list',\n    users: [{ name: 'Inspector', role: 'Inspector' }, { name: 'Reviewer', role: 'Reviewer' }],\n    userIdx: 0, templates: [], inspections: [], draft: null,\n    search: '', statusFilter: 'All', picker: false, lightbox: null, tdraft: null,\n    toast: '', saveState: '', confirm: null,\n  };\n\n  uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }\n  today() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }\n  fmtDate(s) { if (!s) return ''; const d = new Date(typeof s === 'string' && s.length === 10 ? s + 'T12:00' : s); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }\n  fmtTime(t) { return new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }\n  user() { return this.state.users[this.state.userIdx] || this.state.users[0]; }\n\n  async componentDidMount() {\n    for (let i = 0; !window.SieteStore && i < 200; i++) await new Promise(r => setTimeout(r, 25));\n    const m = window.SieteStore;\n    if (!m) { this.toastMsg('Could not load storage.'); return; }\n    this.installPWA();\n    this.store = await m.pickStore();\n    let templates;\n    try { templates = await this.store.listTemplates(); }\n    catch (e) { this.toastMsg('Server unreachable — working offline on this device.'); this.store = m.createLocalStore(); templates = await this.store.listTemplates(); }\n    if (!templates.length) { await this.store.saveTemplate(m.ROOF_TEMPLATE); templates = [m.ROOF_TEMPLATE]; }\n    const inspections = await this.store.listInspections();\n    let ui = {}; try { ui = JSON.parse(localStorage.getItem('siete.ui') || '{}'); } catch (e) {}\n    this.setState({ ready: true, templates, inspections, userIdx: ui.userIdx || 0 });\n    this.onKey = e => {\n      if (!this.state.lightbox) return;\n      if (e.key === 'ArrowRight') this.lbStep(1); else if (e.key === 'ArrowLeft') this.lbStep(-1); else if (e.key === 'Escape') this.setState({ lightbox: null });\n    };\n    window.addEventListener('keydown', this.onKey);\n  }\n  installPWA() {\n    if (!/^https:$/.test(location.protocol) || /claudeusercontent/.test(location.host)) return;\n    const add = (tag, attrs) => { const el = document.createElement(tag); Object.assign(el, attrs); document.head.appendChild(el); };\n    add('link', { rel: 'manifest', href: '/manifest.webmanifest' });\n    add('link', { rel: 'apple-touch-icon', href: '/apple-touch-icon.png' });\n    add('link', { rel: 'icon', href: '/icon-192.png' });\n    add('meta', { name: 'theme-color', content: '#003d67' });\n    add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });\n    add('meta', { name: 'apple-mobile-web-app-title', content: 'Siete Inspections' });\n    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); this.stopCam(); }\n  takePhoto(t) {\n    this.camTarget = t;\n    const phone = /Android|iPhone|iPod/i.test(navigator.userAgent);\n    const pol = document.permissionsPolicy || document.featurePolicy;\n    const framed = window.self !== window.top;\n    if (!phone && framed && pol && pol.allowsFeature && !pol.allowsFeature('camera')) {\n      this.toastMsg('Live camera isn\\u2019t available in this preview — use the standalone app file to take photos.');\n      if (this.capInput) this.capInput.click();\n      return;\n    }\n    if (!phone && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {\n      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })\n        .then(st => { this.camStream = st; this.setState({ camOpen: true }); this.attachCam(); })\n        .catch(err => {\n          const n = err && err.name;\n          const why = n === 'NotAllowedError' ? 'Camera permission was blocked — allow it in the browser address bar, or pick a photo.' : n === 'NotFoundError' ? 'No camera found — pick a photo instead.' : n === 'NotReadableError' ? 'Camera is in use by another app — close it and try again.' : 'Camera unavailable here (' + (n || 'unknown') + ') — pick a photo instead.';\n          this.toastMsg(why); if (n !== 'NotReadableError' && this.capInput) this.capInput.click();\n        });\n    } else if (this.capInput) this.capInput.click();\n  }\n  attachCam() { if (this.camVideo && this.camStream && this.camVideo.srcObject !== this.camStream) { this.camVideo.srcObject = this.camStream; const p = this.camVideo.play(); if (p && p.catch) p.catch(() => {}); } }\n  stopCam() { if (this.camStream) { this.camStream.getTracks().forEach(k => k.stop()); this.camStream = null; } }\n  closeCam() { this.stopCam(); this.setState({ camOpen: false }); }\n  snapCam() {\n    const v = this.camVideo, t = this.camTarget; if (!v || !v.videoWidth || !t) return;\n    const sc = Math.min(1, 1600 / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');\n    c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);\n    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);\n    const img = { id: this.uid(), src: c.toDataURL('image/jpeg', 0.82), at: Date.now() };\n    this.edit(d => { if (t.kind === 'ans') this.ans(t.id).photos.push(img); else d.deficiencies.find(y => y.id === t.id).photos.push(img); });\n    this.closeCam(); this.toastMsg('Photo added.');\n  }\n\n  go(screen) { this.setState({ screen, picker: false }); window.scrollTo(0, 0); }\n  toastMsg(t) { clearTimeout(this.tt); this.setState({ toast: t }); this.tt = setTimeout(() => this.setState({ toast: '' }), 3800); }\n  ask(msg, fn) { this.setState({ confirm: { msg, fn } }); }\n\n  edit(fn, action) {\n    const d = this.state.draft; if (!d) return;\n    fn(d); d.updatedAt = Date.now(); d.updatedBy = this.user().name;\n    if (action) d.history.push({ at: Date.now(), by: this.user().name, action });\n    this.setState({ draft: { ...d }, saveState: 'Saving…' });\n    clearTimeout(this.st); this.st = setTimeout(() => this.persist(), 450);
